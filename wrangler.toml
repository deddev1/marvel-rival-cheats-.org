# CI Workers Builds project name (repo: marvel-rivals-cheats-org)
name = "marvel-rival-cheats--org"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

# Custom domains (marvelrivalscheats.org / www) are attached in the Cloudflare dashboard
# after the zone is on your account: Worker → Settings → Domains & Routes → Add.
# Do NOT declare [[routes]] with custom_domain here — wrangler deploy fails with
# "Could not find zone" when the domain is not yet proxied on the account.

# Local/CLI deploy: Wrangler matches this before upload. Workers Builds also uses postinstall.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Worker serves sitemaps with a single Content-Type (avoids _headers rule stacking on static XML).
run_worker_first = true

# CI Workers Builds project name (repo: marvel-rivals-cheats-org → Worker: marvel-rivals-cheats-org)
name = "marvelrivals"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

# Attach apex + www to this Worker on deploy (Cloudflare creates proxied DNS when the zone is on the account).
[[routes]]
pattern = "marvelrivals.org"
custom_domain = true

[[routes]]
pattern = "www.marvelrivals.org"
custom_domain = true

# Local/CLI deploy: Wrangler matches this before upload. Workers Builds also uses postinstall.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Worker serves sitemaps with a single Content-Type (avoids _headers rule stacking on static XML).
run_worker_first = true
